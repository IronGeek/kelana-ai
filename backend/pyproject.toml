[project]
name = "kelana-ai"
version = "0.1.0"
description = "AI-powered Travel Assistant"
requires-python = ">=3.14"
dependencies = [
    "bcrypt==5.0.0",
    "boto3==1.43.89",
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary==2.9.12",
    "pyjwt==2.13.0",
    "python-dotenv==1.2.3",
    "sqlalchemy==2.0.52",
]

[tool.uv]
managed = true

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "T20"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
