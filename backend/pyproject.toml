[project]
name = "kelana-ai"
version = "0.1.0"
description = "AI-powered Travel Assistant"
requires-python = ">=3.14"
dependencies = [
  "bcrypt==5.0.0",
  "boto3==1.43.90",
  "fastapi[standard]==0.141.1",
  "psycopg[binary]==3.3.5",
  "pyjwt==2.13.0",
  "pytest-asyncio>=1.4.0",
  "sqlalchemy==2.0.52",
]

[tool.uv]
managed = true

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "ruff>=0.16.6",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "T20"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101"]
"migrate.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["**/tests/*"]
